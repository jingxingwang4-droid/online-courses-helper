name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # 语法/编译检查：只需编译，无需导入（刷网课.py 依赖 tkinter/playwright，不做 import）。
      - name: Compile check
        run: python -m py_compile core.py browser_session.py cnki_client.py 刷网课.py

      # 纯逻辑模块可安全 import 检查。
      - name: Import core modules
        run: python -c "import core, browser_session, cnki_client"

      # 只跑纯逻辑单元测试：无需 Chromium，也不访问知网。
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
